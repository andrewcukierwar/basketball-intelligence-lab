[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "basketball-intelligence-lab"
version = "0.1.0"
description = "Independent research into reproducible basketball impact models and predictive intelligence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9",
    "mypy>=1.14",
]
pilot = [
    "duckdb==2.0.1",
    "pbpstats==1.3.11",
]
rapm = [
    "numpy>=1.26,<3",
    "scipy>=1.15,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bil"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
files = ["src"]
