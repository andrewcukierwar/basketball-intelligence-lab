name: Research or engineering task
description: Research question, data contract, experiment, or implementation with explicit evidence and validation
title: "[BIL] "
labels: ["state: not yet started"]
body:
  - type: dropdown
    id: workstream
    attributes:
      label: Workstream
      description: Assign the corresponding GitHub milestone during triage.
      options:
        - M0 Research foundation
        - M1 Validated historical data
        - M2 RAPM
        - M3 SPM
        - M4 Estimated Skills
        - M5 EPM Integration
        - M6 Defensive Tracking
        - M7 Benchmarking
        - M8 Reliable daily pipeline
        - M9 DARKO replication
        - M10 LEBRON replication
        - M11 Cross-model benchmark
        - M12 Original Basketball Intelligence model
        - M13 Public intelligence platform
    validations:
      required: true
  - type: dropdown
    id: complexity
    attributes:
      label: Implementation complexity
      description: Apply the corresponding complexity label during triage.
      options:
        - Low
        - Medium
        - High
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Objective or hypothesis
      description: State what we are trying to establish or implement.
    validations:
      required: true
  - type: dropdown
    id: evidence
    attributes:
      label: Methodology classification
      options:
        - Documented
        - Inferred
        - Experimental
        - Original
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources and relevant design decisions
      description: Link primary references and any uncertainty-register entries.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria and validation
      description: Specify tests, datasets, baselines, evaluation windows and objective exit criteria.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Direct prerequisites
      description: List the issues that must be complete before this task can start, or write None. Add these links to Blocked by after creating the issue.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Exclusions and risks
