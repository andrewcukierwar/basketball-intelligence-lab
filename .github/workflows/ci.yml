name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Python quality and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev,pilot,rapm]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff formatting
        run: ruff format --check .
      - name: Mypy
        run: mypy src
      - name: Pytest
        run: pytest -q
